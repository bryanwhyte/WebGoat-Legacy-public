# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: maven
    # - name: Write Maven settings.xml
    #   run: mkdir -p ~/.m2 && echo "${{ secrets.MAVEN_SETTINGS }}" > ~/.m2/settings.xml
      
    - name: Build with Maven
      run: mvn -B package --file pom.xml

    # # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
    # - name: Update dependency graph
    #   uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
    
    # Perform an evaluation
    - name: Run evaluate action
      id: evaluate
      uses: sonatype/actions/evaluate@v1
      with:
        iq-server-url: ${{ vars.SONATYPE_IQ_URL }}
        username: ${{ secrets.SONATYPE_IQ_USERNAME }}
        password: ${{ secrets.SONATYPE_IQ_PASSWORD }}
        application-id: gha-webgoat-legacy-public
        scan-targets: target/*.war
        sarif-file: 'result.sarif'
        upload-sarif-file: 'true'
        debug: false
        # Print out the results
    - name: Log evaluate action output
      run: echo "${{ steps.evaluate.outputs.scan-id }} ${{ steps.evaluate.outputs.report-url }}"
    - name: Dump evaluate outputs
      run: echo "${{ steps.evaluate.outputs }}"
    - name: Deploy WAR to Nexus
      run: mvn deploy:deploy-file -DgroupId=com.sonatype -DartifactId=project -Dversion=6.0.1 -Dpackaging=war -Dfile=target/WebGoat-6.0.1.war -DrepositoryId=nexus -Durl=https://repo.bwhyte.ngrok.io/repository/maven-public
        
